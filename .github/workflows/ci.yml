name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.100
          cache: true
          cache-dependency-path: |
            Source/PioneerFramework/PioneerFramework.csproj
            Source/PioneerFramework.Tests/PioneerFramework.Tests.csproj
            Source/PioneerFramework.Pure.Tests/PioneerFramework.Pure.Tests.csproj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build PioneerFrameworkLite (Debug)
        run: dotnet build Source/PioneerFramework/PioneerFramework.csproj --configuration Debug -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_debug -p:AppendTargetFrameworkToOutputPath=false

      - name: Build PioneerFrameworkLite (Release)
        run: dotnet build Source/PioneerFramework/PioneerFramework.csproj --configuration Release -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_release -p:AppendTargetFrameworkToOutputPath=false

      # D3(2026-09-14): CI used to INLINE the same two checks that tools/verify-deterministic.ps1
      # and tools/check-committed-dll.ps1 already implement -- two parallel implementations that
      # drift over time (e.g. CI had no warning-count / -WarningDiff coverage). CI now calls the
      # shared scripts, so developers and CI run the exact same code paths.
      - name: Verify deterministic Release build
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-deterministic.ps1

      - name: Verify committed DLL consistency
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-committed-dll.ps1

      - name: Run game integration tests
        run: dotnet test Source/PioneerFramework.Tests/PioneerFramework.Tests.csproj --configuration Debug -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_test_game -p:AppendTargetFrameworkToOutputPath=false

      - name: Run pure math tests
        run: dotnet test Source/PioneerFramework.Pure.Tests/PioneerFramework.Pure.Tests.csproj --configuration Debug -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_test_pure -p:AppendTargetFrameworkToOutputPath=false

      - name: Validate XML / DefOf / localization
        run: python tools/validate_config.py

      - name: Verify committed runtime assets
        shell: pwsh
        run: |
          $required = @(
            "1.6/Assemblies/PioneerFrameworkLite.dll",
            "1.6/AssetBundles/pfview_outline_win",
            "1.6/AssetBundles/pfview_outline_mac",
            "1.6/AssetBundles/pfview_outline_linux",
            "Shaders/PFView_OutlineMask.shader",
            "Shaders/PFView_OutlineDilate.shader",
            "Shaders/PFView_OutlineComposite.shader"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required committed asset is missing: $path"
            }
          }
