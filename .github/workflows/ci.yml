name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # BACKEND-LOCK.md：后端（物理步 / 时间基 / 状态提交）未经授权不得修改。
      # 只在 PR 上强制：给"顺手改后端"的 PR 一个快速红灯，红字正文即规则。
      # 命中时输出【NOSTEPANYMORE】，要求提 PR 的人先拿到 DesignNotes/后端变更授权-*.md。
      - name: Backend lock check (BACKEND-LOCK.md)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-backend-lock.ps1 -Base "${{ github.event.pull_request.base.sha }}" -Fail

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            Source/PioneerFramework/PioneerFramework.csproj
            Source/PioneerFramework.Tests/PioneerFramework.Tests.csproj
            Source/PioneerFramework.Pure.Tests/PioneerFramework.Pure.Tests.csproj
            Source/MechJebLibTest/MechJebLibTest.csproj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify game reference dependencies
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-game-dependencies.ps1

      - name: Build PioneerFrameworkLite (Debug)
        run: dotnet build Source/PioneerFramework/PioneerFramework.csproj --configuration Debug -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_debug -p:AppendTargetFrameworkToOutputPath=false

      - name: Build PioneerFrameworkLite (Release)
        run: dotnet build Source/PioneerFramework/PioneerFramework.csproj --configuration Release -v:minimal -p:OutputPath=$env:RUNNER_TEMP/pfl_release -p:AppendTargetFrameworkToOutputPath=false

      # D3(2026-09-14): CI used to INLINE the same two checks that tools/verify-deterministic.ps1
      # and tools/check-committed-dll.ps1 already implement -- two parallel implementations that
      # drift over time (e.g. CI had no warning-count / -WarningDiff coverage). CI now calls the
      # shared scripts, so developers and CI run the exact same code paths.
      - name: Verify deterministic Release build
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-deterministic.ps1

      - name: Verify committed DLL consistency (1.7 deliverable)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-committed-dll.ps1

      - name: Run game integration tests
        run: dotnet test Source/PioneerFramework.Tests/PioneerFramework.Tests.csproj --configuration Debug -v:minimal

      - name: Run pure math tests (net10.0)
        run: dotnet test Source/PioneerFramework.Pure.Tests/PioneerFramework.Pure.Tests.csproj --configuration Debug -v:minimal

      # 第三方移植物（MechJebLib 数值底座）的上游测试套保留 net48 的数值基线。
      # 详见 Source/PioneerFramework/ThirdParty/MechJebLib/README.md
      - name: Run ported MechJebLib tests
        run: dotnet test Source/MechJebLibTest/MechJebLibTest.csproj --configuration Debug -v:minimal

      - name: Validate XML / DefOf / localization
        run: python tools/validate_config.py

      - name: Run Python tool regression tests
        run: python -m unittest discover -s tools/tests -v

      # 2026-10-13 (tree split): the frozen 1.6 package is guarded by a HASH-PINNED script
      # (tools/check-frozen-1.6.ps1) instead of an asset-presence list; the 1.7 deliverable is
      # covered by "Verify committed DLL consistency" above (now pointing at 1.7/Assemblies).
      - name: Verify frozen 1.6 line
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-frozen-1.6.ps1
