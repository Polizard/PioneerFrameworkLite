<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Microsoft YaHei, 'Noto Sans SC', 'Segoe UI Symbol', sans-serif">
<rect x="0" y="0" width="1200" height="900" fill="#15191D" stroke="#616C7A" stroke-width="1"/>
<text x="24" y="46" font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="600">C+ 方案：1 + 7 + 4 / 26/14/11 / 金色收敛 / 无网格</text>
<text x="24" y="70" font-size="10" fill="#A5A9AD" text-anchor="start">从 C 的 824/864 分栏改成同一根 12 列：左 1 列（尺寸/级轨）+ 中 7 列（画布）+ 右 4 列（状态/检视）。</text>
