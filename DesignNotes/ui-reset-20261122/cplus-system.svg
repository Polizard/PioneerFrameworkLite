<text x="92" y="428" font-size="9" fill="#6E747B" text-anchor="start">控件选中：白 7% + 白 30% 1px</text>
<rect x="360" y="410" width="56" height="26" fill="none" stroke="#DBB40C" stroke-width="1"/>
<line x1="360" y1="410" x2="376" y2="410" stroke="#DBB40C" stroke-width="2"/>
<text x="428" y="428" font-size="9" fill="#6E747B" text-anchor="start">对象焦点：金 L 角标 + 1px</text>
