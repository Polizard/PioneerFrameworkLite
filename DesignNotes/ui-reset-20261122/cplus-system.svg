<text x="620" y="528" font-size="11" fill="#6E747B" text-anchor="end">11 行 / 11 件</text>
<text x="40" y="563" font-size="11" fill="#6E747B" text-anchor="start">01</text>
<text x="72" y="563" font-size="11" fill="#A5A9AD" text-anchor="start">0</text>
<text x="104" y="563" font-size="14" fill="#FFFFFF" text-anchor="start">调试控制核心</text>
<text x="620" y="563" font-size="14" fill="#A5A9AD" text-anchor="end">≡</text>
<rect x="24" y="576" width="620" height="36" fill="#FFFFFF" fill-opacity="0.07"/>
<rect x="24" y="576" width="3" height="36" fill="#DBB40C"/>
<text x="40" y="599" font-size="11" fill="#6E747B" text-anchor="start">02</text>
<text x="72" y="599" font-size="11" fill="#A5A9AD" text-anchor="start">0</text>
<text x="104" y="599" font-size="14" fill="#FFFFFF" text-anchor="start">二级液氧煤油罐</text>
<text x="620" y="599" font-size="14" fill="#A5A9AD" text-anchor="end">≡</text>
<text x="40" y="635" font-size="11" fill="#6E747B" text-anchor="start">03</text>
<text x="72" y="635" font-size="11" fill="#A5A9AD" text-anchor="start">0</text>
<text x="104" y="635" font-size="14" fill="#FFFFFF" text-anchor="start">小推力液氧煤油机</text>
<text x="620" y="635" font-size="14" fill="#A5A9AD" text-anchor="end">≡</text>
<text x="664" y="528" font-size="9" fill="#6E747B" text-anchor="start">画布区居中 137–777；右栏 808–1184 保留，行→右栏同步。</text>
<text x="664" y="548" font-size="9" fill="#6E747B" text-anchor="start">件数全 1 时隐藏；“序”表头删掉；44 行是 DMSNF Home 的标准。</text>
<line x1="24" y1="680" x2="1176" y2="680" stroke="#2E363F" stroke-width="1"/>
<text x="24" y="714" font-size="12" fill="#FFFFFF" text-anchor="start">05 / 删除</text>
<text x="24" y="742" font-size="11" fill="#FF3333" text-anchor="start">— 64px 画布网格</text>
<text x="24" y="762" font-size="11" fill="#FF3333" text-anchor="start">— 引擎金边</text>
<text x="24" y="782" font-size="11" fill="#FF3333" text-anchor="start">— 2×2 动作墙</text>
