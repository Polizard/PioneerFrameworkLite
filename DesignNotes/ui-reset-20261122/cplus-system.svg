<text x="24" y="340" font-size="11" fill="#A5A9AD" text-anchor="start">TWR 1.18　级 0　100 t</text>
<text x="360" y="340" font-size="9" fill="#6E747B" text-anchor="start">11 Tiny · 标签 / 表头 / 数字</text>
