<text x="1139" y="158" font-size="11" fill="#6E747B" text-anchor="middle">12</text>
<text x="24" y="196" font-size="11" fill="#A5A9AD" text-anchor="start">1 列 = 尺寸/级轨　7 列 = 画布　4 列 = 状态/检视；L0/L1 共用同一根分栏，画布不横跳。</text>
<text x="24" y="236" font-size="12" fill="#FFFFFF" text-anchor="start">02 / 字体：只用三级 26 / 14 / 11</text>
<text x="24" y="278" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="600">火箭组装器</text>
