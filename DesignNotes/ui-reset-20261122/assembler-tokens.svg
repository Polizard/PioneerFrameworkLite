<text x="360" y="746" font-size="9" fill="#A5A9AD" text-anchor="start">1. 金色只用于：当前选中、进行中/可发射；不画金色按钮。</text>
<text x="360" y="766" font-size="9" fill="#A5A9AD" text-anchor="start">2. 红色只用于：阻断、错误、必被拒。不得当装饰。</text>
<text x="360" y="786" font-size="9" fill="#A5A9AD" text-anchor="start">3. 按钮直接用原版 9-slice；不自绘渐变、发光、圆角卡片。</text>
<text x="360" y="806" font-size="9" fill="#A5A9AD" text-anchor="start">4. 数字右对齐并用等宽字形；行号 01 两位。</text>
<text x="360" y="826" font-size="9" fill="#A5A9AD" text-anchor="start">5. 不画字面磁带、CRT 扫描线、霓虹；设备感靠线与槽。</text>
<text x="360" y="846" font-size="9" fill="#A5A9AD" text-anchor="start">6. 每个面板只有一个标题；标题下 1px 线，不再加卡片。</text>
<text x="360" y="866" font-size="9" fill="#A5A9AD" text-anchor="start">7. 空状态写「当前状态 + 原因 + 下一步」，不放 — / …。</text>
<text x="360" y="886" font-size="9" fill="#A5A9AD" text-anchor="start">8. 调试入口只在 DevMode 出现，且与主操作分栏。</text>
<text x="360" y="906" font-size="9" fill="#A5A9AD" text-anchor="start">9. 微图标 ↑↓× 无底板，热区 16–20px；动作按钮才用原版贴图。</text>
